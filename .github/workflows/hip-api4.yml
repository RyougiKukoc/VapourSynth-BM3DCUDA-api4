name: Build HIP API4 on Arch

on:
  workflow_dispatch:
    inputs:
      gpu_targets:
        description: "Semicolon-separated AMD GPU targets"
        required: false
        default: "gfx1100"
        type: string

jobs:
  build:
    name: Build bm3dhip with Arch ROCm
    runs-on: ubuntu-24.04
    container: archlinux:latest

    steps:
      - name: Install Arch dependencies
        shell: bash
        run: |
          set -euxo pipefail
          pacman -Syu --noconfirm --needed git cmake ninja gcc hip-runtime-amd vapoursynth
          pacman -Scc --noconfirm

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure HIP API4 build
        shell: bash
        env:
          GPU_TARGETS: ${{ inputs.gpu_targets }}
        run: |
          set -euxo pipefail
          VS_INCLUDE="$(python -c 'import vapoursynth as vs; from pathlib import Path; print(Path(vs.__file__).parent / "include")')"
          test -f "$VS_INCLUDE/VapourSynth4.h"
          test -f "$VS_INCLUDE/VSHelper4.h"
          cmake -S . -B build_hip -G Ninja \
            -D CMAKE_BUILD_TYPE=Release \
            -D ENABLE_CPU=OFF \
            -D ENABLE_CUDA=OFF \
            -D ENABLE_CUDA_RTC=OFF \
            -D ENABLE_HIP=ON \
            -D ENABLE_SYCL=OFF \
            -D CMAKE_CXX_COMPILER=/opt/rocm/bin/amdclang++ \
            -D CMAKE_PREFIX_PATH=/opt/rocm/lib/cmake \
            -D VAPOURSYNTH_INCLUDE_DIRECTORY="$VS_INCLUDE" \
            -D GPU_TARGETS="$GPU_TARGETS"

      - name: Build and install artifact
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build_hip --verbose
          cmake --install build_hip --prefix "$GITHUB_WORKSPACE/artifact"
          ldd artifact/lib/libbm3dhip.so

      - name: Smoke-load API4 plugin without a GPU
        shell: bash
        run: |
          set -euxo pipefail
          python -c 'import vapoursynth as vs; from pathlib import Path; vs.core.std.LoadPlugin(path=str(Path("artifact/lib/libbm3dhip.so").resolve())); assert vs.core.bm3dhip.BM3D; assert vs.core.bm3dhip.BM3Dv2'

      - name: Upload HIP plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: bm3dhip-api4-arch
          path: artifact/lib/libbm3dhip.so
          if-no-files-found: error
